[build]
  publish = "dist"

# Cabeçalhos de segurança para quando o app for publicado na Netlify.
# No GitHub Pages não é possível definir cabeçalhos HTTP; lá valem apenas
# as meta tags do app.html (CSP e Referrer-Policy).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'none'; connect-src 'self' https://brasilapi.com.br https://publica.cnpj.ws https://*.supabase.co; manifest-src 'self'; worker-src 'self'; frame-src 'none'; child-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'"

# O service worker e o HTML precisam ser revalidados sempre,
# senão o celular continua preso em uma versão antiga.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/instalar.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
