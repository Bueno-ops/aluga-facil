[build]
  publish = "dist"

# O service worker e o HTML precisam ser revalidados sempre,
# senão o celular continua preso em uma versão antiga.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/instalar.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
