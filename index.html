<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aluga Fácil — Aluguel de máquinas</title>
    <meta name="description" content="PWA de aluguel de máquinas: encontre, favorite e reserve equipamentos para sua obra.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#0f766e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Aluga Fácil">
    <meta http-equiv="refresh" content="0;url=app.html">
    <script>
        // Garante o redirecionamento também em hospedagens que servem index como diretório
        if (location.pathname.charAt(location.pathname.length - 1) === '/' || /\/index\.html$/.test(location.pathname)) {
            location.replace('app.html' + location.search + location.hash);
        }
    </script>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f8; color: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { text-align: center; padding: 24px; }
        .logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(140deg, #0f766e, #34d399); display: grid; place-items: center; margin: 0 auto 14px; color: #fff; font-size: 28px; }
        a { color: #0f766e; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <div class="logo" aria-hidden="true">🏠</div>
        <h1 style="font-size:1.2rem">Aluga Fácil</h1>
        <p style="color:#5d6b80;font-size:.9rem">Abrindo o app…</p>
        <p><a href="app.html">Continuar para o Aluga Fácil</a></p>
    </main>
</body>
</html>
